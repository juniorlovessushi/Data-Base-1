name: Build & Test POE Part 2 (REST API)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.sln

    - name: Build API Solution
      run: dotnet build RaceDay.API/RaceDay.API.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test RaceDay.API/RaceDay.API.sln --no-build --configuration Release --verbosity normal
